name: build-image

on:
  workflow_dispatch:        # manual trigger: gh workflow run build-image
    inputs:
      bake_model:
        description: 'Bake the 24GB model into the image (false = lean env-only)'
        type: choice
        options: ['true', 'false']
        default: 'true'

env:
  GHCR_IMAGE: ghcr.io/olafthebro/riftbound-vast-image:unsloth

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Docker Hub is the PRIMARY registry: Vast serves docker.io from its own
      # mirror/cache (fast pulls), while ghcr.io goes host-direct at ~10MB/s
      # (every ghcr boot took 25-40 min). ghcr tag kept as a fallback.
      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Resolve image tag suffix
        id: tags
        run: |
          if [ "${{ inputs.bake_model }}" = "false" ]; then echo "suffix=env" >> $GITHUB_OUTPUT; else echo "suffix=unsloth" >> $GITHUB_OUTPUT; fi

      - name: Build and push (${{ inputs.bake_model == 'false' && 'env-only' || 'env + baked model' }})
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ghcr.io/olafthebro/riftbound-vast-image:${{ steps.tags.outputs.suffix }}
            docker.io/${{ secrets.DOCKERHUB_USERNAME }}/riftbound-train:${{ steps.tags.outputs.suffix }}
          build-args: |
            BAKE_MODEL=${{ inputs.bake_model }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          # HF read token for the model download — buildkit secret, never in layers
          secrets: |
            hf_token=${{ secrets.HF_TOKEN }}

      # GHCR user packages default to PRIVATE — Vast hosts pull anonymously,
      # so the package must be public (contents are env-build only, no IP).
      - name: Make GHCR package public
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh api --method POST user/packages/container/riftbound-vast-image/visibility \
            -f visibility=public --jq '{visibility}' || true
